*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Hind,system-ui,sans-serif;color:#0A0A0A;background:#fff;font-size:16px;line-height:1.45}
header{position:sticky;top:0;background:#FBF8F2;color:#0A0A0A;border-bottom:1px solid #E5E5E5;padding:12px 16px 10px;z-index:5}
header .row{display:flex;align-items:center;gap:10px}
header b{font-family:Khand;font-weight:700;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
header small{margin-left:auto;font-size:12px;color:#737373;letter-spacing:1px}
.bar{height:3px;background:#E5E5E5;margin-top:8px}.bar i{display:block;height:3px;background:#171717;width:0}
main{padding:16px 16px 110px;max-width:640px;margin:0 auto}
h1{font-family:Khand;font-weight:700;font-size:34px;line-height:1.05;margin:4px 0 4px}
h2{font-family:Khand;font-weight:700;font-size:22px;margin:0 0 6px;line-height:1.15}
.lv{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#737373}
.muted{color:#737373;font-size:14px}
.thumb{float:right;width:84px;height:112px;object-fit:cover;margin:0 0 8px 12px;border:1px solid #E5E5E5}
.q{border:1px solid #E5E5E5;padding:14px;margin:14px 0;clear:both}
.q.done{border-color:#171717}
.ctx{font-size:13px;color:#737373;margin:0 0 10px;background:#F5F5F5;padding:8px 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid #171717;background:#fff;color:#171717;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;border-radius:0;text-align:left}
.opt.on{background:#F3EDE2;color:#0A0A0A;box-shadow:inset 3px 0 0 #171717;font-weight:700}
.opt.ns{border-style:dashed}
textarea{width:100%;margin-top:8px;font:inherit;font-size:15px;border:1px solid #D4D4D4;padding:8px;border-radius:0;min-height:42px}
.ph{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.ph label{border:1px solid #D4D4D4;padding:6px 10px;cursor:pointer}
.ph img{width:44px;height:44px;object-fit:cover}
.ph button{border:0;background:none;color:#737373;text-decoration:underline;font:inherit;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E5E5E5;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.btn{flex:1;font-family:Hind;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;font-size:13px;padding:14px 10px;border:1px solid #171717;background:#fff;color:#171717;border-radius:0;cursor:pointer}
.btn.pri{background:#F3EDE2;color:#0A0A0A;border-width:2px}
.list a{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #E5E5E5;color:#0A0A0A;text-decoration:none}
.list a span{color:#737373;font-size:14px}
pre{white-space:pre-wrap;background:#F5F5F5;padding:12px;font-size:13px;max-height:340px;overflow:auto}
.ok{color:#171717;font-size:13px;margin-top:6px;min-height:18px}

<script>
var __pho;/* Photos: IndexedDB (fq-photos/p), JPEG ~1600px. S.a[qid].photo = count. */
const PHO=(()=>{let dbp;const db=()=>dbp=dbp||new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error("No IndexedDB"));const r=indexedDB.open("fq-photos-r4",1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore("p",{keyPath:"id",autoIncrement:true});s.createIndex("q","q")};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
 const tx=async(m,f)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction("p",m);let out;const st=t.objectStore("p");Promise.resolve(f(st)).then(v=>out=v);t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>no(t.error||new Error("Storage failed"))})};
 const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
 const list=q=>tx("readonly",st=>req(q?st.index("q").getAll(q):st.getAll()));
 const toast=(t,bad)=>{const e=document.getElementById("fqToast");e.textContent=t;e.className="on"+(bad?" bad":"");clearTimeout(e._t);e._t=setTimeout(()=>e.className="",2200)};
 async function compress(f){let src;try{src=await createImageBitmap(f,{imageOrientation:"from-image"})}catch(e){src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("Can't read "+(f.name||"photo")+(/heic|heif/i.test(f.type+f.name)?" (HEIC). In iPhone Settings > Camera > Formats pick Most Compatible, or choose it from Photos.":"")));im.src=URL.createObjectURL(f)})}
  const w=src.width,h=src.height,k=Math.min(1,1600/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("Couldn't compress photo")),"image/jpeg",.82))}
 const setCount=(q,n)=>{S.a[q]=S.a[q]||{v:[]};if(n)S.a[q].photo=n;else delete S.a[q].photo;save();prog()};
 async function render(el,q){const ps=await list(q);setCount(q,ps.length);const st=el.querySelector("[data-strip]"),bd=el.querySelector("[data-badge]");
  st.querySelectorAll("img").forEach(i=>URL.revokeObjectURL(i.src));
  st.innerHTML=ps.map(p=>`<div class="fq-th"><img src="${URL.createObjectURL(p.blob)}" alt="Photo"><button type="button" aria-label="Remove photo" data-del="${p.id}">×</button></div>`).join("");
  bd.textContent=ps.length;bd.classList.toggle("on",ps.length>0);el.classList.toggle("done",answered(QS.find(x=>x.id==q)));
  st.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{await tx("readwrite",s=>s.delete(+b.dataset.del));toast("Photo removed")}catch(e){err(el,e)}render(el,q)})}
 const err=(el,e)=>{const m="Photo not saved: "+(e&&e.message||e);el.querySelector("[data-err]").textContent=m;toast("Photo not saved",1)};
 function bind(el,q){const inp=el.querySelector("input[type=file]");render(el,q).catch(e=>err(el,e));
  inp.onchange=async()=>{const fs=[...inp.files];inp.value="";if(!fs.length)return;el.querySelector("[data-err]").textContent="";let ok=0;
   for(const f of fs){try{const b=await compress(f);await tx("readwrite",s=>s.add({q,blob:b,t:Date.now()}));ok++}catch(e){err(el,e)}}
   if(ok)toast(ok>1?ok+" photos added":"Photo added");render(el,q).catch(e=>err(el,e))}}
 const total=()=>QS.reduce((n,q)=>n+((S.a[q.id]&&+S.a[q.id].photo)||0),0);
 async function files(){const ps=await list();const c={};return ps.map(p=>{c[p.q]=(c[p.q]||0)+1;return new File([p.blob],`${p.q}-${c[p.q]}.jpg`,{type:"image/jpeg"})})}
 async function shareAll(){try{const fs=await files();if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs,title:"Finish Questions Photos"});return}toast("Sharing photos isn't supported here. Downloading a zip.");zipAll()}catch(e){if(e&&e.name==="AbortError")return;toast("Couldn't share: "+e.message,1)}}
 const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return d=>{let c=~0;for(let i=0;i<d.length;i++)c=t[(c^d[i])&255]^(c>>>8);return(~c)>>>0}})();

  for(const f of fs){const d=new Uint8Array(await f.arrayBuffer()),nm=enc.encode(f.name),crc=CRC(d);const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,1);h.setUint16(4,20,1);h.setUint32(14,crc,1);h.setUint32(18,d.length,1);h.setUint32(22,d.length,1);h.setUint16(26,nm.length,1);parts.push(h,nm,d);
   const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,1);c.setUint16(4,20,1);c.setUint16(6,20,1);c.setUint32(16,crc,1);c.setUint32(20,d.length,1);c.setUint32(24,d.length,1);c.setUint16(28,nm.length,1);c.setUint32(42,off,1);cd.push(c,nm);off+=30+nm.length+d.length}
  const cdl=cd.reduce((n,x)=>n+x.byteLength,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,1);e.setUint16(8,fs.length,1);e.setUint16(10,fs.length,1);e.setUint32(12,cdl,1);e.setUint32(16,off,1);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([...parts,...cd,e],{type:"application/zip"}));a.download="moschouris-finish-photos.zip";document.body.appendChild(a);a.click();a.remove();toast("Zip downloaded")}catch(e){toast("Couldn't make zip: "+e.message,1)}}
 /* migrate old inline data-URL photos (Round 3 v1) into IndexedDB; then sync counts */
 setTimeout(async()=>{try{for(const q of QS){const a=S.a[q.id];if(a&&typeof a.photo==="string"&&a.photo.startsWith("data:")){const b=await (await fetch(a.photo)).blob();await tx("readwrite",s=>s.add({q:q.id,blob:b,t:Date.now()}));a.photo=1;save()}}
  const ps=await list();const c={};ps.forEach(p=>c[p.q]=(c[p.q]||0)+1);QS.forEach(q=>{const a=S.a[q.id];if(a&&a.photo&&!c[q.id])delete a.photo;if(c[q.id]){S.a[q.id]=a||{v:[]};S.a[q.id].photo=c[q.id]}});save();prog()}catch(e){}},0);
 return{bind,total,shareAll,zipAll,list}})();
